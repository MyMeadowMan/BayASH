<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e6f0f3;--bg2:#d6e6ea;--surf:rgba(255,255,255,.82);--surf2:#f2f8fa;--text:#12262b;--mut:#4e6a72;--line:rgba(18,50,60,.12);--snow:#7aa3b3;--pix:"Pixelify Sans","Bricolage Grotesque",system-ui,sans-serif;
--win:#0f9d58;--loss:#d93a4a;--glow:.35;--sh:0 10px 30px rgba(30,45,90,.10);
--disp:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06110f;--bg2:#0b1c19;--surf:rgba(16,34,31,.78);--surf2:#16302b;--text:#f1f7f3;--mut:#93b3aa;--line:rgba(190,255,230,.14);--snow:#ffffff;--pix:"Pixelify Sans","Bricolage Grotesque",system-ui,sans-serif;--win:#5df2a6;--loss:#ff7a85;--glow:.55;--sh:0 14px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#06110f;--bg2:#0b1c19;--surf:rgba(16,34,31,.78);--surf2:#16302b;--text:#f1f7f3;--mut:#93b3aa;--line:rgba(190,255,230,.14);--snow:#ffffff;--pix:"Pixelify Sans","Bricolage Grotesque",system-ui,sans-serif;--win:#3ddc97;--loss:#ff6b7a;--glow:.55;--sh:0 14px 40px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.45 var(--body);
background:radial-gradient(800px 500px at 90% -8%,rgba(214,40,57,calc(var(--glow)*.38)),transparent 60%),radial-gradient(800px 600px at -10% 15%,rgba(24,150,90,calc(var(--glow)*.42)),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(245,196,81,calc(var(--glow)*.18)),transparent 70%),var(--bg);background-attachment:fixed}
main{position:relative;z-index:2;max-width:620px;margin:0 auto;padding:46px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font:700 38px/.95 var(--pix);letter-spacing:-.5px;margin:0}h1 em{display:block;font:500 14px var(--body);font-style:normal;color:#f5c451;margin-top:8px;letter-spacing:.2px}
.date{color:var(--mut);font-size:13px;text-align:right;line-height:1.3}
h2{font:700 22px var(--pix);margin:32px 0 12px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 20px;color:#fff;box-shadow:var(--sh);
background:linear-gradient(145deg,var(--c1),var(--c2));isolation:isolate;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 65%);z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.35));z-index:-1}
.hero{border:0;padding-top:34px}.snowcap{position:absolute;left:0;right:0;top:0;height:14px;background:radial-gradient(circle at 12px 0,#fff 11px,transparent 12px) 0 0/24px 14px repeat-x;opacity:.95;z-index:1}.candy{position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(-45deg,#d62839 0 9px,#fff 9px 18px);z-index:1}.hero small{font-size:13px;opacity:.88}
.hero .big{font:700 clamp(34px,10vw,48px)/.98 var(--pix);letter-spacing:-.5px;margin:10px 0 8px}
.hero .when{font-size:15px;opacity:.95}
.clock{display:flex;gap:8px;margin-top:18px}
.clock div{flex:1;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:50% 50% 46% 46%/42% 42% 58% 58%;padding:9px 4px;text-align:center}
.clock b{display:block;font:700 26px/1.1 var(--pix);font-variant-numeric:tabular-nums}
.clock span{font-size:11.5px;opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* alerts */
.alert{display:flex;gap:12px;align-items:center;margin-top:12px;padding:13px 14px;border-radius:18px;background:linear-gradient(90deg,rgba(214,40,57,.28),rgba(24,150,90,.2));border:1px solid rgba(245,196,81,.5);font-size:14px}
.alert i{font-style:normal;font-size:22px}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(var(--line),var(--line))}
.ev{position:relative;backdrop-filter:blur(10px);background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px}
.ev::before{content:"";position:absolute;left:-23px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--c2);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--c2);image-rendering:pixelated;transform:rotate(45deg)}
.mono{flex:none;width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:2px}.mono svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.ev .w{flex:1;min-width:0}.ev .mono{width:46px;height:46px;background:linear-gradient(145deg,var(--c1),var(--c2))}
.ev b{display:block;font:700 17px var(--pix)}
.ev span{color:var(--mut);font-size:13px}
.tag{flex:none;font-size:11.5px;font-weight:700;color:#ffb020;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.4);border-radius:99px;padding:3px 9px}
/* team cards */
.card{backdrop-filter:blur(10px);background:var(--surf);border:1px solid var(--line);border-radius:24px;margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}
.card header{position:relative;display:flex;align-items:center;gap:14px;padding:16px;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));cursor:pointer;-webkit-tap-highlight-color:transparent}
.card header::after{content:"";position:absolute;right:-30px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 65%)}
.card header .mono{width:60px;height:60px}.card header::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:radial-gradient(circle at 10px 0,#fff 9px,transparent 10px) 0 0/20px 10px repeat-x;z-index:2}
.card header .nm{flex:1;position:relative;z-index:1}
.card header b{font:700 24px var(--pix);display:block}
.card header span{font-size:12.5px;opacity:.85}
.rec{position:relative;z-index:1;font:700 28px var(--pix);text-align:right;line-height:1}
.rec small{display:block;font:500 11.5px var(--body);opacity:.85;margin-top:3px;letter-spacing:0}
.chev{position:relative;z-index:1;transition:transform .3s;font-size:14px}
.card.open .chev{transform:rotate(180deg)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.card.open .fold{grid-template-rows:1fr}
.fold>div{overflow:hidden}
.in{padding:4px 16px 16px}
.pills{display:flex;gap:7px;padding:14px 0 6px;flex-wrap:wrap}
.pill{border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;border:1px solid}
.pill.W{color:var(--win);border-color:color-mix(in srgb,var(--win) 45%,transparent);background:color-mix(in srgb,var(--win) 12%,transparent)}
.pill.L{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 45%,transparent);background:color-mix(in srgb,var(--loss) 12%,transparent)}
.sec{font:700 16px var(--pix);color:var(--mut);margin:14px 0 4px}
.g{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.g em{font-style:normal;color:var(--mut);font-size:13px;white-space:nowrap}
.W2{color:var(--win);font-weight:700}.L2{color:var(--loss);font-weight:700}
.note{color:var(--mut);font-size:12.5px;margin-top:26px;text-align:center}
@media (prefers-reduced-motion:reduce){.hero{animation:none}.fold,.chev{transition:none}}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#trees{position:fixed;left:0;right:0;bottom:0;z-index:1;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px);opacity:.55}
#trees svg{image-rendering:pixelated}
#lights{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:30px;z-index:5;pointer-events:none;display:flex;justify-content:space-around;align-items:flex-start;background:linear-gradient(var(--bg),transparent)}
#lights::before{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:#1a1a1a;opacity:.6}
#lights i{width:9px;height:13px;margin-top:4px;border-radius:2px 2px 5px 5px;background:var(--lc);box-shadow:0 0 10px 2px var(--lc);animation:tw 2.4s infinite;animation-delay:var(--dl)}
@keyframes tw{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#lights i{animation:none}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--text);padding:9px 15px;border-radius:99px;font:600 14px var(--body);cursor:pointer;backdrop-filter:blur(10px)}
.chip.on{background:linear-gradient(135deg,#d62839,#1f9d55);color:#fff;border-color:transparent}
.badge{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin:-4px 0 10px}
.dot{width:8px;height:8px;border-radius:50%;background:#8a97a3}.dot.on{background:#3ddc97;box-shadow:0 0 8px #3ddc97}
.xm{color:#f5c451;font-size:13px;margin-left:auto}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4d5e;margin-right:6px;animation:tw 1.1s infinite}
.score{font:700 34px var(--pix);margin:2px 0}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button,.set button{flex:1;border:1px solid var(--line);background:var(--surf);color:var(--text);padding:11px;border-radius:14px;font:600 14px var(--body);cursor:pointer}
.plus{flex:none;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surf2);color:var(--text);font-size:19px;line-height:1;cursor:pointer}
.tag.r{color:#ff6b7a;background:rgba(255,107,122,.14);border-color:rgba(255,107,122,.4)}
.setrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}.setrow span{flex:1;font-size:14px}.setrow button{flex:none;padding:8px 13px}
.setrow button.on{background:linear-gradient(135deg,#d62839,#1f9d55);color:#fff;border-color:transparent}
.set{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(10px)}
body.classic{background:radial-gradient(800px 500px at 90% -8%,rgba(255,120,40,calc(var(--glow)*.3)),transparent 60%),radial-gradient(800px 600px at -10% 15%,rgba(50,110,255,calc(var(--glow)*.35)),transparent 60%),var(--bg)}
body.classic .snowcap,body.classic .candy{display:none}
.nw{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(10px);box-shadow:var(--sh)}
.nw .mono{width:42px;height:42px;background:linear-gradient(145deg,var(--c1),var(--c2))}
.nw b{display:block;font:700 15px/1.3 var(--body)}.nw span{color:var(--mut);font-size:12.5px}
.more{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0}.more a{font-size:13px;color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--surf);padding:7px 12px;border-radius:99px}
.nnote{color:var(--mut);font-size:12.5px;margin:-4px 0 12px}
.top{position:relative;display:block;overflow:hidden;border-radius:24px;color:#fff;text-decoration:none;min-height:170px;padding:16px;margin-bottom:12px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:var(--sh)}
.top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62))}
.top .mono{position:absolute;right:12px;top:12px;z-index:2;width:52px;height:52px}
.tt{position:relative;z-index:2;margin-top:52px}.tt small{font-size:12.5px;opacity:.9}
.tt b{display:block;font:700 21px/1.18 var(--pix);margin:5px 0 6px}.tt p{margin:0;font-size:13.5px;opacity:.92;line-height:1.35}
.nw em{display:block;font-style:normal;color:var(--mut);font-size:13px;line-height:1.3;margin:2px 0 3px}
.nw.seen b{opacity:.55}
.nw .new,.top .new{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:#d62839;border-radius:99px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.sk{height:74px;border-radius:18px;margin-bottom:10px;background:linear-gradient(90deg,var(--surf),var(--surf2),var(--surf));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prev button{border:1px solid var(--line);background:var(--surf2);color:var(--text);padding:10px;border-radius:12px;font:600 13px var(--body);cursor:pointer}
.fx{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.fx.win{pointer-events:auto;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.25),rgba(0,0,0,.78))}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--c2),transparent 70%);opacity:0;animation:fl .9s ease-out}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fxm{position:relative;width:150px;height:150px;filter:drop-shadow(0 0 22px var(--c2));animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.fxm svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.fx.win .fxm{width:230px;height:230px;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both,pu 1s .8s infinite alternate}
.m-swim .fxm{animation:sw 2.8s linear both}
.m-lights .fxm{animation:ri .8s ease-out both}.m-rain .fxm{animation:pop .6s both,bn .5s .6s 3 alternate}
.fxt{position:relative;text-align:center;margin-top:10px;color:#fff;font-family:var(--pix);text-shadow:0 3px 0 var(--c1),0 0 26px var(--c2);animation:pop .6s .15s both}
.fxt b{display:block;font-size:clamp(30px,10vw,54px);line-height:1}.fxt span{font-size:18px}
.fx.win .fxt b{font-size:clamp(42px,15vw,80px)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
@keyframes pu{to{transform:scale(1.08) rotate(2deg)}}
@keyframes bn{to{transform:translateY(-16px)}}
@keyframes ri{from{transform:translateY(60vh)}to{transform:none}}
@keyframes sw{from{transform:translateX(-120vw) rotate(-6deg)}50%{transform:translateX(0) rotate(4deg)}to{transform:translateX(120vw) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.fxm,.fxt{animation:none}.fx::before{animation:none}}
</style>
</head>

 const b=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BayAreaHub//EN"];
 evs.forEach((e,i)=>{const s=new Date(e.iso);b.push("BEGIN:VEVENT","UID:"+z(s)+"-"+i+"@bayareahub","DTSTAMP:"+z(new Date()),"DTSTART:"+z(s),"DTEND:"+z(new Date(+s+DUR[e.t.lg]*36e5)),"SUMMARY:"+e.t.n+" "+e.txt,"END:VEVENT")});
 b.push("END:VCALENDAR");try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b.join("\r\n")],{type:"text/calendar"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function addOne(i){ics([WK[i]],"game.ics")}
function addAll(){ics(WK,"bay-area-week.ics")}
function shareWk(){const t="My Bay Area week:\n"+WK.map(g=>g.t.n+" "+g.txt+", "+dayT(g.iso)).join("\n");
 if(navigator.share)navigator.share({title:"Bay Area Hub",text:t}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{b2.textContent="Copied!";setTimeout(()=>b2.textContent="Share my week",1500)}).catch(()=>{})}
function setF(k){filter=k;render()}
function setH(v){ST.hol=v;save();theme();render()}
function setSnow(v){ST.snow=v;save();theme();render()}
function render(){
 const now=Date.now(),keys=Object.keys(TEAMS),ks=filter==="all"?keys:[filter];
 theme();
 dot.className="dot"+(live?" on":"");stamp.textContent=live?"Live data, updated "+stampT:"Snapshot from Nov 14, 2026";
 document.querySelector(".date").innerHTML="Today<br>"+fmt(now,{weekday:"short",month:"short",day:"numeric"});
 chips.innerHTML=[["all","All teams"]].concat(keys.map(k=>[k,TEAMS[k].n])).map(([k,n])=>`<button class="chip${filter===k?" on":""}" onclick="setF('${k}')">${n}</button>`).join("");
 const all=[];ks.forEach(k=>TEAMS[k].next.forEach(([iso,txt])=>all.push({k,iso,txt,ts:+new Date(iso),t:TEAMS[k]})));
 all.sort((a,b)=>a.ts-b.ts);
 const up=all.filter(g=>g.ts>now-3*36e5),lg=LIVEG.filter(x=>ks.includes(x.k))[0],nx=up[0];
 clearInterval(clk);
 if(lg){const t=TEAMS[lg.k];hero.innerHTML=`<div class="hero" style="--c1:${t.c1};--c2:${t.c2}"><i class="snowcap"></i><i class="candy"></i><small><span class="pulse"></span>Live now in ${t.lg}</small><div class="big">${t.n}<br>${lg.txt}</div><div class="score">${lg.score}</div><div class="when">${lg.detail}</div></div>`}
 else if(nx){hero.innerHTML=`<div class="hero" style="--c1:${nx.t.c1};--c2:${nx.t.c2}"><i class="snowcap"></i><i class="candy"></i><small>Up next in ${nx.t.lg}</small><div class="big">${nx.t.n}<br>${nx.txt}</div><div class="when">${dayT(nx.iso)}</div><div class="clock"><div><b id="d">0</b><span>days</span></div><div><b id="h">0</b><span>hours</span></div><div><b id="m">0</b><span>min</span></div><div><b id="s">0</b><span>sec</span></div></div></div>`;
  const tk=()=>{const x=Math.max(0,Math.floor((nx.ts-Date.now())/1000));d.textContent=Math.floor(x/86400);h.textContent=Math.floor(x%86400/3600);m.textContent=Math.floor(x%3600/60);s.textContent=x%60};tk();clk=setInterval(tk,1000)}
 else hero.innerHTML=`<div class="hero" style="--c1:#1b1b1f;--c2:#fd5a1e"><i class="snowcap"></i><i class="candy"></i><small>All quiet</small><div class="big">No games scheduled</div><div class="when">New games appear here when the schedule updates.</div></div>`;
 const wk=up.filter(g=>g.ts<now+7*864e5);WK=wk;const clash=new Set();
 for(let i=0;i<wk.length;i++)for(let j=i+1;j<wk.length;j++)if(Math.abs(wk[i].ts-wk[j].ts)<3*36e5){clash.add(i);clash.add(j)}
 week.innerHTML=wk.map((g,i)=>`<div class="ev" style="--c1:${g.t.c1};--c2:${g.t.c2}"><div class="mono">${art(g.k)}</div><div class="w"><b>${g.t.n} ${g.txt}</b><span>${dayT(g.iso)}</span></div>${isRiv(g.k,g.txt)?'<span class="tag r">Rivalry</span>':''}${clash.has(i)?'<span class="tag">Overlap</span>':''}<button class="plus" aria-label="Add to calendar" onclick="addOne(${i})">+</button></div>`).join("")||'<div class="ev"><span>Nothing scheduled this week.</span></div>';
 b1.style.display=b2.style.display=wk.length?"":"none";
 const td=wk.filter(g=>new Date(g.ts).toDateString()===new Date().toDateString()),by={};
 wk.forEach(g=>{const k=fmt(g.iso,{weekday:"long"});(by[k]=by[k]||[]).push(g)});
 const tm=g=>fmt(g.iso,{hour:"numeric",minute:"2-digit"});
 alerts.innerHTML=(td.length?`<div class="alert"><i>🏟️</i><div><b>Today:</b> ${td.map(g=>g.t.n+" at "+tm(g)).join(", then ")}.</div></div>`:"")+Object.entries(by).filter(([k,a])=>a.length>1&&new Date(a[0].ts).toDateString()!==new Date().toDateString()).slice(0,1).map(([k,a])=>`<div class="alert"><i>🎄</i><div><b>${k} is stacked.</b> ${a.map(g=>g.t.n+" at "+tm(g)).join(", then ")}.</div></div>`).join("");

 const items=[];ks.forEach(k=>(NEWSL[k]||NEWS.filter(n=>n.k===k)).forEach(n=>items.push(n)));
 items.sort((a,b)=>(b.d?+new Date(b.d):0)-(a.d?+new Date(a.d):0));
 nnote.textContent=newsLive?(newsCached?"Headlines from your last live update":"Live headlines from ESPN"):"Saved headlines from Nov 14. Live headlines show up when you host the page yourself.";
 const seen=ST.seen||[],isNew=n=>n.d&&Date.now()-new Date(n.d)<864e5&&!seen.includes(n.url),link=n=>/^https:\/\//.test(n.url||"")?n.url:"#";
 const row=(n,top)=>{const t=TEAMS[n.k],sty=`--c1:${t.c1};--c2:${t.c2}`,u=esc(link(n)),clk=`onclick="markSeen('${u.replace(/'/g,"")}');this.classList.add('seen')"`,tm=ago(n.d);
  if(top)return `<a class="top" href="${u}" target="_blank" rel="noopener" ${clk} style="${sty}">${n.img&&/^https:\/\//.test(n.img)?`<img src="${esc(n.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}<div class="mono">${art(n.k)}</div><div class="tt"><small>${isNew(n)?'<span class="new">NEW</span>':""}${esc(t.n)}${tm?", "+tm:""}, ${esc(n.src)}</small><b>${esc(n.t)}</b>${n.s?`<p>${esc(n.s)}</p>`:""}</div></a>`;
  return `<a class="nw${seen.includes(n.url)?" seen":""}" href="${u}" target="_blank" rel="noopener" ${clk} style="${sty}"><div class="mono">${art(n.k)}</div><div><b>${isNew(n)?'<span class="new">NEW</span>':""}${esc(n.t)}</b>${n.s?`<em>${esc(n.s)}</em>`:""}<span>${esc(t.n)}, ${esc(n.src)}${tm?", "+tm:""}</span></div></a>`};
 const gq=k=>({niners:"San Francisco 49ers",giants:"San Francisco Giants",sharks:"San Jose Sharks",warriors:"Golden State Warriors"}[k]);
 news.innerHTML=pulling?'<div class="sk"></div><div class="sk"></div><div class="sk"></div>':(items.length?row(items[0],true)+items.slice(1,9).map(n=>row(n)).join(""):'<div class="ev"><span>No headlines yet.</span></div>')+`<div class="more"><a href="#" onclick="refreshNews();return false">Refresh news</a>${ks.map(k=>`<a href="${esc(G(gq(k)))}" target="_blank" rel="noopener">More ${esc(TEAMS[k].n)} news</a>`).join("")}</div>`;
 teams.innerHTML=ks.map((k,i)=>{const t=TEAMS[k],sk=streak(t.form);return `<div class="card${i==0?' open':''}" style="--c1:${t.c1};--c2:${t.c2}"><header onclick="this.parentNode.classList.toggle('open')"><div class="mono">${art(k)}</div><div class="nm"><b>${t.n}</b><span>${t.lg}${sk?", "+sk:""}</span></div><div class="rec">${t.rec}<small>${t.sub}</small></div><div class="chev">▼</div></header><div class="fold"><div><div class="in">
${t.form.length?`<div class="pills">${t.form.slice().reverse().map(f=>`<span class="pill ${f[0]}">${f[0]}</span>`).join("")}</div><div class="sec">Recent results, newest first</div>`+t.form.map(f=>`<div class="g"><span class="${f[0]}2">${f[0]=="W"?"Win":"Loss"}</span><em>${f[1]}</em></div>`).join(""):""}
${t.extra?`<div class="g" style="border-top:0"><span>${t.extra}</span></div>`:""}
${t.next.length?`<div class="sec">Coming up</div>`+t.next.filter(n=>new Date(n[0])>now-3*36e5).map(n=>`<div class="g"><span>${n[1]}</span><em>${dayT(n[0])}</em></div>`).join(""):""}
</div></div></div></div>`}).join("");
 const on=(c)=>c?" on":"";
 sets.innerHTML=`<div class="setrow"><span>Holiday theme</span>${[["auto","Auto"],["on","On"],["off","Off"]].map(([v,n])=>`<button class="${on((ST.hol||"auto")===v)}" onclick="setH('${v}')">${n}</button>`).join("")}</div><div class="setrow"><span>Falling snow</span><button class="${on(ST.snow!==false)}" onclick="setSnow(true)">On</button><button class="${on(ST.snow===false)}" onclick="setSnow(false)">Off</button></div><div class="setrow"><span>Celebrations</span><button class="${on(ST.fx!==false)}" onclick="setFx(true)">On</button><button class="${on(ST.fx===false)}" onclick="setFx(false)">Off</button></div><div class="sec" style="margin:6px 0">Preview celebrations</div><div class="prev">${Object.keys(TEAMS).map(k=>`<button onclick="celebrate('${k}','${k==="warriors"?"quarter":"score"}')">${TEAMS[k].n} ${k==="warriors"?"quarter":"score"}</button>`).join("")}${Object.keys(TEAMS).map(k=>`<button onclick="celebrate('${k}','win')">${TEAMS[k].n} win</button>`).join("")}</div><div style="font-size:12.5px;color:var(--mut);margin-top:10px">Auto turns the holiday look on from mid-November to early January.</div>`}
render();pull();setInterval(()=>{if(document.hidden)return;if(Object.keys(LAST).length||Date.now()-lastPull>=6e4)pull()},15000);
</script>
</body>
</html>
